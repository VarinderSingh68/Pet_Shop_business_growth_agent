services:
  - type: web
    name: happy-tails-pet-shop
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: Happy Tails Pet Store
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: APP_LOCALE
        value: en
      - key: APP_CURRENCY
        value: INR
      - key: APP_CURRENCY_SYMBOL
        value: "₹"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA
        value: /etc/secrets/ca.pem
      - key: MAIL_MODE
        value: log
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Happy Tails Pet Store
      - key: SMS_MODE
        value: log
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PAYMENT_GATEWAY
        value: razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: DEVELOPER_TOOLS
        value: "false"
      - key: CRON_SECRET
        generateValue: true

# No `cron` service here: Render's Cron Job service type requires a paid
# plan (no free tier), so the Growth Agent is triggered instead via
# GET /api/v1/cron/run?secret=<CRON_SECRET> — see DEPLOY.md for wiring up
# a free external scheduler (cron-job.org, GitHub Actions, etc.) to hit it
# every 15 minutes.
